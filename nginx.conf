server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static text assets so first-load JS/CSS/HTML transfer smaller over the wire
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/woff2;

    # Hashed build assets (js/css/img with content hashes in the filename) never change,
    # so let browsers/CDNs cache them indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so users/crawlers get the latest routing + meta
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: let react-router handle any path that isn't a real file
    # (this is what makes shared/bookmarked links like /services and /portfolio work)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: beep-software/sanchez-restore-more

jobs:
  build-and-deploy:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build React app
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG=${{ github.sha }}

          docker build \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            .

          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Deploy to k3s
        if: github.event_name == 'push'
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          kubectl set image deployment/sanchez-restore-more \
            sanchez-restore-more="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          kubectl rollout status deployment/sanchez-restore-more \
            --timeout=5m